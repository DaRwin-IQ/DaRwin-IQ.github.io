<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaRwiN-IQ — Package Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --accent: #00f3ff;
            --accent-dim: rgba(0, 243, 255, 0.3);
            --purple: #bc00ff;
            --glass: rgba(20, 20, 30, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── BACKGROUND EFFECTS ── */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(188, 0, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 243, 255, 0.1) 0%, transparent 40%);
            z-index: -1;
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(ellipse at center, black, transparent 80%);
            z-index: -1;
            opacity: 0.5;
        }

        .container {
            max-width: 800px;
            width: 90%;
            padding: 60px 0;
        }

        /* ── HEADER ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.5rem;
            letter-spacing: 0.1em;
            color: var(--accent);
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            opacity: 0.6;
            transition: 0.2s;
        }
        .back-btn:hover { opacity: 1; color: var(--accent); }

        /* ── PACKAGE INFO ── */
        .package-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .package-title-row {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 30px;
        }

        .package-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: #111;
            animation: floatIcon 3s ease-in-out infinite, glowIcon 2s ease-in-out infinite;
            --glow-color: var(--accent);
            object-fit: cover;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes glowIcon {
            0%, 100% { box-shadow: 0 0 5px var(--glow-color); border: 1px solid rgba(255,255,255,0.1); }
            50% { box-shadow: 0 0 25px var(--glow-color); border: 1px solid var(--glow-color); }
        }

        .package-name {
            font-size: 2rem;
            font-weight: 800;
        }

        .package-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent);
            opacity: 0.7;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .detail-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 10px;
        }

        .detail-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .detail-val {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .description {
            line-height: 1.7;
            color: #ccc;
            margin-bottom: 40px;
        }

        .action-bar {
            display: flex;
            gap: 15px;
        }

        .btn-main {
            flex: 1;
            text-align: center;
            padding: 15px;
            background: var(--accent);
            color: black;
            text-decoration: none;
            font-weight: 800;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-main:hover {
            box-shadow: 0 0 25px var(--accent);
            transform: translateY(-2px);
        }

        .btn-sec {
            flex: 1;
            text-align: center;
            padding: 15px;
            border: 1px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-sec:hover {
            background: rgba(0, 243, 255, 0.1);
        }

        /* ── LOADING ── */
        #loading {
            padding: 100px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
        }

        @media (max-width: 600px) {
            .details-grid { grid-template-columns: 1fr; }
            .package-title-row { flex-direction: column; text-align: center; }
            .action-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>

    <div class="container">
        <header class="header">
            <h1>DaRwiN-IQ</h1>
            <a href="../" class="back-btn">< BACK HOME</a>
        </header>

        <div id="loading">INITIALIZING SYSTEM...</div>

        <div id="content" style="display: none;">
            <div class="package-card">
                <div class="package-title-row">
                    <img id="pkg-icon" src="" class="package-icon" alt="">
                    <div>
                        <div id="pkg-id" class="package-id"></div>
                        <h2 id="pkg-name" class="package-name"></h2>
                    </div>
                </div>

                <div class="description" id="pkg-desc"></div>

                <div class="details-grid">
                    <div class="detail-item">
                        <div class="detail-label">Version</div>
                        <div class="detail-val" id="pkg-version"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Compatibility</div>
                        <div class="detail-val">iOS 14.0+</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Section</div>
                        <div class="detail-val">Tweaks</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Price</div>
                        <div class="detail-val">Free</div>
                    </div>
                </div>

                <div class="action-bar">
                    <a id="download-link" href="#" class="btn-main">DOWNLOAD .DEB</a>
                    <a href="sileo://source/https://darwin-iq.github.io/" class="btn-sec">ADD SOURCE</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data from packages.js (should be available globally)
        // For fallback if data isn't loaded yet
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const packageId = urlParams.get('package') || 'com.darwiniq.autoclicker';

            // Wait for packages array to be available
            const checkData = setInterval(() => {
                if (window.packages) {
                    clearInterval(checkData);
                    renderPackage(packageId);
                }
            }, 100);

            // Timeout after 3s
            setTimeout(() => clearInterval(checkData), 3000);
        });

        function renderPackage(id) {
            const pkg = window.packages.find(p => p.id === id);
            if (!pkg) {
                document.getElementById('loading').textContent = 'ERROR: PACKAGE NOT FOUND';
                return;
            }

            document.getElementById('pkg-icon').src = `../assets/package-icons/${id}.png`;
            document.getElementById('pkg-id').textContent = `# ${pkg.id}`;
            document.getElementById('pkg-name').textContent = pkg.name;
            document.getElementById('pkg-desc').textContent = pkg.desc;
            document.getElementById('pkg-version').textContent = `v${pkg.version}`;
            document.getElementById('download-link').href = `../${pkg.download}`;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }
    </script>
    
    <script src="../assets/js/packages.js"></script>
</body>
</html>
