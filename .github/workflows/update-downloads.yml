name: Update Downloads

on:
  schedule:
    # Run once a day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow running manually from the Actions tab

jobs:
  update-downloads:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes to the repo
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Update Download Counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/update_downloads.py
          python3 .github/scripts/update_downloads.py
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add depictions/**/depiction.json
          
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: update download counts"
            git push
          else
            echo "No changes to commit."
          fi
